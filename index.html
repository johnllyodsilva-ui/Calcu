<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="calc" aria-label="Calculator">
  <div class="screen" aria-live="polite">
    <div class="history" id="history"></div>
    <div class="display" id="display">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="util" data-act="clear">AC</button>
    <button class="util" data-act="back" aria-label="Backspace">⌫</button>
    <button class="util" data-act="percent">%</button>
    <button class="op" data-op="/">÷</button>

    <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
    <button class="op" data-op="*">×</button>

    <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
    <button class="op" data-op="-">−</button>

    <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button data-num="0" class="wide">0</button>
    <button data-act="dot">.</button>
    <button class="op" data-act="equals">=</button>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
